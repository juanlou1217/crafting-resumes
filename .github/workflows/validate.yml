name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -B -m unittest discover -s tests/crafting-china-resumes -p 'test_*.py'
      - name: Validate frozen behavior assets
        run: python -B tests/crafting-china-resumes/behavior/validate_eval_assets.py
      - name: Hash installable Skill tree
        run: python -B tests/crafting-china-resumes/hash_skill_tree.py skills/crafting-china-resumes
